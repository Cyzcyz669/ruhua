<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>入画 · 密钥</title>
<body style="font:16px/1.6 -apple-system,sans-serif;background:#EFE9DC;color:#3D4247;max-width:520px;margin:12vh auto;padding:0 20px">
<h2 style="font-weight:500">入画 · 粘贴密钥</h2>
<p>这个页面只在本机浏览器里暂存，不会发到任何地方。</p>
<form onsubmit="event.preventDefault();document.getElementById('ok').textContent='已收到';">
<label for="apikey">API 密钥</label><br>
<input id="apikey" name="apikey" type="password" autocomplete="off" style="width:100%;padding:8px;margin:6px 0 12px;font:inherit">
<button id="save" type="submit" style="padding:8px 18px;font:inherit">保存</button> <span id="ok"></span>
</form></body></html>
