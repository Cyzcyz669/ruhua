<script>const SHADERS={"scene":"#version 300 es\nprecision highp float;\nuniform vec2 R; uniform float T;\nuniform vec3 uCam, uTa; uniform float uFov, uRoll;\nuniform vec3 uSun, uSunC, uSky0, uSky1, uFogC, uAmb;\nuniform float uFog, uNight, uMist, uCloud, uPeach, uLamp, uCave, uWet;\nuniform vec4 uRib[5]; uniform vec4 uBoat; // xyz, yaw\nuniform vec3 uJinP; uniform float uJinA, uJinOpen; uniform sampler2D uJ0, uJ1;\nuniform vec4 uGlow; uniform float uDbg; uniform vec4 uNet,uHand; // 山口之光 xyz, 强度\nout vec4 O;\n#define PI 3.14159265\nfloat h1(float n){return fract(sin(n)*43758.5453);}\nfloat h2(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n2(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),u.x),mix(h2(i+vec2(0,1)),h2(i+1.),u.x),u.y);}\nfloat n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float n=i.x+i.y*57.+i.z*113.;\n return mix(mix(mix(h1(n),h1(n+1.),f.x),mix(h1(n+57.),h1(n+58.),f.x),f.y),mix(mix(h1(n+113.),h1(n+114.),f.x),mix(h1(n+170.),h1(n+171.),f.x),f.y),f.z);}\nconst mat2 M2=mat2(1.6,1.2,-1.2,1.6);\nfloat LODT=0.;int OCT=5;\nfloat fb2(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){if(i>=OCT){s+=a*.5;a*=.5;continue;}s+=a*n2(p);p=M2*p;a*=.5;}return s;}\nvoid setLod(float t){LODT=t;OCT=t>140.?2:(t>60.?3:(t>25.?4:5));}\nfloat fb2l(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*n2(p);p=M2*p;a*=.5;}return s;}\nfloat fb3(vec3 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*n3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}\nfloat sbox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}\nfloat scap(vec3 p,vec3 a,vec3 b,float r0,float r1){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(r0,r1,h);}\nfloat smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}\nmat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}\nfloat rx(float z){return sin(z*.021)*9.+sin(z*.047+1.)*3.;}\nconst vec3 VC=vec3(0.,0.,640.);\nconst float MZ0=401.,MZ1=462.;\nfloat tunX(float z){return rx(400.)+5.2+sin((z-MZ0)*.11)*.9;}\nfloat tunF(float z){return mix(.35,6.2,smoothstep(MZ0,MZ1,z));}\nfloat peaks(vec2 p){float h=0.;vec2 c=floor(p/46.);\n for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=c+vec2(i,j),o=h22(g);vec2 q=(g+.2+.6*o)*46.;\n  float d=length((p-q)*vec2(1.,.8+.4*o.x)),r=13.+15.*o.x,H=(26.+58.*o.y);float s=clamp(1.-d/r,0.,1.);h=max(h,H*pow(s,.55)*(1.-.25*pow(1.-s,3.))*smoothstep(0.,.25,s));}return h;}\nfloat fieldsH(vec2 p,out float kind){vec2 q=rot(.12)*(p-VC.xz);vec2 cs=vec2(15.,9.);vec2 c=floor(q/cs),f=fract(q/cs)*cs;\n float e=min(min(f.x,cs.x-f.x),min(f.y,cs.y-f.y));float r=h2(c);kind=r<.62?1.:2.;\n float lev=(kind==1.?-.07:.22)+floor(length(q)/50.)*.0;float bund=smoothstep(.55,.2,e);\n return mix(lev,.24,bund)+(kind==2.?.05*sin(f.y*3.3):0.);}\nfloat pond(vec2 p){float d=length(p-vec2(-38.,662.))-11.;d=min(d,length((p-vec2(42.,596.))*vec2(1.,1.4))-9.);return d;}\nfloat exitM(vec2 p){return 1.-(1.-smoothstep(470.,545.,p.y))*exp(-pow((p.x-tunX(MZ1))/50.,2.));}\nfloat basinH(vec2 p,out float kind){vec2 d=p-VC.xz;float r=length(d*vec2(1.,1.15));kind=0.;\n float g=.35+fb2l(p*.05)*.5;\n if(r>68.&&r<165.){float k;float fh=fieldsH(p,k);float m=smoothstep(68.,74.,r)*(1.-smoothstep(150.,165.,r));\n  float path=abs(p.x-tunX(MZ1)*(1.-smoothstep(470.,560.,p.y)))-1.6;if(p.y<575.&&path<0.)m=0.;\n  g=mix(g,fh,m);if(m>.5)kind=k;}\n float pd=pond(p);if(pd<0.){g=min(g,-.9*smoothstep(0.,-5.,pd)-.05);kind=3.;}\n g+=smoothstep(150.,230.,r)*(8.+fb2(p*.03)*12.)*exitM(p);\n g+=5.8*(1.-smoothstep(462.,505.,p.y))*exp(-pow((p.x-tunX(MZ1))/22.,2.));\n return g;}\nfloat valleyH(vec2 p){float x=abs(p.x-rx(p.y));float v=smoothstep(4.5,24.,x);\n return -1.4+smoothstep(2.6,6.,x)*1.62+v*3.+fb2(p*.08)*2.*v+(LODT>70.?.08:fb2l(p*.6
