<script>const SHADERS={"scene":"#version 300 es\nprecision highp float;\nuniform vec2 R; uniform float T;\n#define ZERO min(int(abs(T)),0)\nuniform vec3 uCam, uTa; uniform float uFov, uRoll;\nuniform vec3 uSun, uSunC, uSky0, uSky1, uFogC, uAmb;\nuniform float uFog, uNight, uMist, uCloud, uPeach, uLamp, uCave, uWet;\nuniform vec4 uRib[5]; uniform vec4 uBoat; // xyz, yaw\nuniform vec3 uJinP; uniform float uJinA, uJinOpen; uniform sampler2D uJ0, uJ1;\nuniform vec4 uGlow; uniform float uDbg; uniform float uQ, uShQ; uniform vec4 uNet,uHand; // 山口之光 xyz, 强度\nout vec4 O;\n#define PI 3.14159265\nfloat h1(float n){return fract(sin(n)*43758.5453);}\nfloat h2(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}\nvec2 h22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}\nfloat n2(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),u.x),mix(h2(i+vec2(0,1)),h2(i+1.),u.x),u.y);}\nfloat n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float n=i.x+i.y*57.+i.z*113.;\n return mix(mix(mix(h1(n),h1(n+1.),f.x),mix(h1(n+57.),h1(n+58.),f.x),f.y),mix(mix(h1(n+113.),h1(n+114.),f.x),mix(h1(n+170.),h1(n+171.),f.x),f.y),f.z);}\nconst mat2 M2=mat2(1.6,1.2,-1.2,1.6);\nfloat LODT=0.;int OCT=5;\nfloat fb2(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){if(i>=OCT){s+=a*.5;a*=.5;continue;}s+=a*n2(p);p=M2*p;a*=.5;}return s;}\nvoid setLod(float t){LODT=t;OCT=t>140.?2:(t>60.?3:(t>25.?4:5));}\nfloat fb2l(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*n2(p);p=M2*p;a*=.5;}return s;}\nfloat fb3(vec3 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*n3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}\nfloat sbox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}\nfloat scap(vec3 p,vec3 a,vec3 b,float r0,float r1){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(r0,r1,h);}\nfloat smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}\nmat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}\nfloat sdEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.)/max(k1,1e-5);}\nfloat rx(float z){return sin(z*.021)*9.+sin(z*.047+1.)*3.;}\nconst vec3 VC=vec3(0.,0.,640.);\nconst float MZ0=401.,MZ1=462.;\nfloat tunX(float z){return rx(400.)+5.2+sin((z-MZ0)*.11)*.9;}\nfloat tunF(float z){return mix(.35,6.2,smoothstep(MZ0,MZ1,z));}\nfloat peaks(vec2 p){float h=0.;vec2 c=floor(p/46.);\n for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=c+vec2(i,j),o=h22(g);vec2 q=(g+.2+.6*o)*46.;\n  float d=length((p-q)*vec2(1.,.8+.4*o.x)),r=13.+15.*o.x,H=(26.+58.*o.y);float s=clamp(1.-d/r,0.,1.);h=max(h,H*pow(s,.55)*(1.-.25*pow(1.-s,3.))*smoothstep(0.,.25,s));}return h;}\nfloat fieldsH(vec2 p,out float kind){vec2 q=rot(.12)*(p-VC.xz);vec2 cs=vec2(15.,9.);vec2 c=floor(q/cs),f=fract(q/cs)*cs;\n float e=min(min(f.x,cs.x-f.x),min(f.y,cs.y-f.y));float r=h2(c);kind=r<.62?1.:2.;\n float lev=(kind==1.?-.07:.22)+floor(length(q)/50.)*.0;float bund=smoothstep(.55,.2,e);\n return mix(lev,.24,bund)+(kind==2.?.05*sin(f.y*3.3):0.);}\nfloat pond(vec2 p){float d=length(p-vec2(-38.,662.))-11.;d=min(d,length((p-vec2(42.,596.))*vec2(1.,1.4))-9.);return d;}\nfloat exitM(vec2 p){return 1.-(1.-smoothstep(470.,545.,p.y))*exp(-pow((p.x-tunX(MZ1))/50.,2.));}\nfloat basinH(vec2 p,out float kind){vec2 d=p-VC.xz;float r=length(d*vec2(1.,1.15));kind=0.;\n float g=.35+fb2l(p*.05)*.5;\n if(r>68.&&r<165.){float k;float fh=fieldsH(p,k);float m=smoothstep(68.,74.,r)*(1.-smoothstep(150.,165.,r));\n  float path=abs(p.x-tunX(MZ1)*(1.-smoothstep(470.,560.,p.y)))-(p.y>565.?2.7:1.6);if(p.y<712.)m*=smoothstep(0.,.5,path); // 村里土路两侧不起田埂\n  g=mix(g,fh,m);if(m>.5)kind=k;}\n float pd=pond(p);if(pd<0.){g=min(g,-.9*smoothstep(0.,-5.,pd)-.05);kind=3.;}\n g+=smoothstep(150.,230.,r)*(8.+fb2(p*.03)*12.)*exitM(p);\n g+=5.8*(1.-smoothstep(462.,505.,p.y))*exp(-pow((p.x-tunX(MZ1))/22.,2.));\n return g;}\nfloat valleyH(vec2 p){float x=abs(p.x-rx(p.y));float v=smoothstep(4.5,24.,x);\n return -1.4+smoothstep(2.6,6.,x)*1.62+v*3.+fb2(p*.08)*2.*v+(LODT>70.?.08:fb2l(p*.6)*.16)*smoothstep(4.,7.,x);}\nfloat KIND,PKM=1.;\nfloat terr(vec2 p){float k=0.;float a=p.y<480.?valleyH(p):0.,c=p.y>440.?basinH(p,k):0.;float w=smoothstep(445.,470.,p.y);float g=mix(a,c,w);KIND=w>.5?k:0.;\n float x=abs(p.x-rx(p.y));float mA=smoothstep(18.,46.,x)*(1.-w);vec2 d=p-VC.xz;float mC=smoothstep(140.,200.,length(d*vec2(1.,1.15)))*w*exitM(p);\n float m=mA+mC;float pk=m>0.?peaks(p)*m*(.75+.5*n2(p*.02)):0.;PKM=clamp(m,0.,1.);\n return g+pk;}\nfloat tower(vec3 q,float R,float H){float yy=clamp(q.y/H,0.,1.);float r=R*(1.-.85*pow(yy,2.2))*(1.+.25*pow(1.-yy,4.));return max(length(q.xz)-r,q.y-H);}\nfloat wallD(vec3 p){float y=max(p.y,0.);\n float zf=397.+1.2*sin(p.x*.13)+(fb2l(vec2(p.x*.22,p.y*.09))-.5)*2.6+y*.25;\n float zb=465.5+(fb2l(vec2(p.x*.2,p.y*.1)+7.)-.5)*2.-y*.25;\n float base=max(max(zf-p.z,p.z-zb),p.y-(18.+fb2l(p.xz*.04)*14.))*.6;\n float tw=tower(p-vec3(14.,0.,427.),23.,96.);\n tw=min(tw,tower(p-vec3(-22.,0.,431.),21.,78.));tw=min(tw,tower(p-vec3(47.,0.,428.),24.,68.));\n tw=min(tw,tower(p-vec3(-56.,0.,446.),27.,88.));tw=min(tw,tower(p-vec3(80.,0.,447.),22.,58.));tw=min(tw,tower(p-vec3(-18.,0.,458.),17.,62.));\n tw+=(fb3(p*vec3(.12,.08,.12))-.5)*3.2+(n3(p*.5)-.5)*.4;\n return smin(base,tw*.5,4.);}\nfloat tunnel(vec3 p){float cx=tunX(p.z),fl=tunF(p.z);float z=p.z;\n float w=mix(.62,1.25,smoothstep(MZ0+8.,MZ1-10.,z))+.18*n2(vec2(z*.4,p.y*.5));\n float slit=smoothstep(MZ0+9.,MZ0+15.,z);\n float top=mix(fl+2.35,fl+300.,slit);\n float dx=abs(p.x-cx)-w-max(0.,p.y-fl-3.)*.025*slit-(fb3(p*1.3)-.5)*.35-(fb3(p*.7+3.)-.5)*1.1*(1.-smoothstep(MZ0-4.,MZ0+5.,z));\n float yy=p.y-fl;float ax=p.x-cx-.18*yy+.25;float arch=top-(1.-slit)*(.9*pow(clamp(abs(ax)/w,0.,1.),1.6)+(fb3(p*vec3(1.6,.9,1.6)+5.)-.5)*.9+.35*sin(ax*2.3));\n float dy=max(-yy,yy-(arch-fl));\n float dz=max(MZ0-9.-z,z-MZ1-7.);\n return max(max(dx,dy),dz);}\nvec3 LQ;float BLOOM=1.;uniform float uBloomZ;\nvec3 treeA(float id,float s){float z=id*6.5+3.25+(h1(id*7.1+s)-.5)*3.;float x=rx(z)+s*(6.+h1(id*3.3+s*9.)*10.);return vec3(x,0,z);}\nvec2 tree(vec3 p,vec3 c,float id,float sc,float kind,out vec3 lq){\n vec3 q=(p-c)/sc;lq=q;float bd=length(q-vec3(0,3.,0))-4.6;if(bd>.6)return vec2(bd*sc,2.);float s=sign(h1(id*4.7)-.5);\n vec3 top=vec3(.5*(h1(id+1.3)-.5),2.5,.4*(h1(id*2.+.7)-.5));\n float tr=scap(q,vec3(0,-.3,0),top,.24,.09);\n tr=min(tr,scap(q,top*.6,top+vec3(1.4*s,.8,.3),.1,.035));\n tr=min(tr,scap(q,top*.75,top+vec3(-1.1*s,1.,-.6),.08,.03));\n float bl=kind<.5?uPeach*BLOOM:1.;\n if(bl<.95){ // 花还没开（或已落尽）时枝条露在外面：再添一根主枝和六根细枝，免得像一把弹弓\n  tr=min(tr,scap(q,top*.92,top+vec3(.3*s,1.3,.7),.06,.022));\n  for(int j=ZERO;j<6;j++){float fj=float(j);vec3 a0=j<3?top*.6:top*.75,a1=j<3?top+vec3(1.4*s,.8,.3):top+vec3(-1.1*s,1.,-.6);\n   vec3 st=mix(a0,a1,.4+.6*fract(fj*.37+h1(id+fj)));\n   vec3 dr=vec3((h1(id*1.7+fj*3.1)-.5)*1.1+(j<3?.3:-.3)*s,.5+.45*h1(id*2.3+fj),(h1(id*3.9+fj*1.3)-.5)*1.1);\n   tr=min(tr,scap(q,st,st+dr*(.5+.35*h1(id+fj*5.)),.032,.01));}}\n if(bl<.002)return vec2(tr*sc,3.); // 光秃秃的：不必算树冠\n vec3 cq=q-top-vec3(0,.85,0);float cd=1e9;\n for(int b=0;b<7;b++){float fb=float(b);vec3 o=vec3(h1(id*3.+fb)-.5,h1(id*5.+fb*1.7)-.42,h1(id*7.+fb*2.3)-.5)*vec3(5.,1.5,4.3);vec3 e=(cq-o)*vec3(1.,1.3,1.);cd=smin(cd,length(e)-(.55+.45*h1(id+fb*9.)),.45);}\n cd=max(cd,-(fb3(q*1.3+id*.37)-.5)*2.5);\n cd+=(fb3(q*2.4+id)-.5)*1.25+(n3(q*7.)-.5)*.45+(n3(q*15.)-.5)*.22;\n cd=mix(cd+2.6,cd,bl); // 一棵接一棵开花；第七幕散尽\n float d=min(tr,cd*.62)*sc;return vec2(d,cd<tr?(kind<.5?2.:8.):3.);}\nvec2 treesA(vec3 p){float s=sign(p.x-rx(p.z));float id0=floor(p.z/6.5);vec2 best=vec2(1e9,0);\n for(int k=-1;k<=1;k++){float id=id0+float(k);if(id*6.5<128.||id*6.5>392.)continue;vec3 c=treeA(id,s);c.y=valleyH(c.xz)-.2;BLOOM=smoothstep(uBloomZ+36.,uBloomZ+13.,c.z);float sc=.8+.45*h1(id*1.9+s);\n  vec3 lq;vec2 t=tree(p,c,id+s*31.,sc,0.,lq);if(t.x<best.x){best=t;LQ=lq;}}return best;}\nvec2 treesC(vec3 p){BLOOM=1.;vec2 g=floor(p.xz/9.);vec2 sg=step(.5,fract(p.xz/9.))*2.-1.;vec2 best=vec2(1e9,0);\n for(int j=0;j<2;j++)for(int i=0;i<2;i++){vec2 c=g+vec2(i,j)*sg;\n  float r=h2(c+7.);vec2 o=(c+.25+.5*h22(c))*9.;float dv=length((o-VC.xz)*vec2(1.,1.15));\n  float dens=dv<70.?.33:(dv<160.?.08:0.);if(o.y<470.)dens=0.;if(r>dens)continue;\n  vec2 hc=floor((o-VC.xz)/11.);vec2 hf=fract((o-VC.xz)/11.);if(dv<66.&&abs(hf.x-.5)<.42&&abs(hf.y-.5)<.42&&abs(hc.x)>0.)continue;\n  float k=0.;vec3 cc=vec3(o.x,basinH(o,k)-.15,o.y);if(k==1.||k==3.)continue;\n  float id=dot(c,vec2(17.,131.));vec3 lq;vec2 t=tree(p,cc,id,.75+.4*h1(id),h1(id*9.)<.45?1.:0.,lq);if(t.x<best.x){best=t;LQ=lq;}}\n return best;}\nfloat bamboo(vec3 p,out float leaf){vec2 c=vec2(-24.,610.);vec2 d=p.xz-c;leaf=1e9;if(length(d)>11.5)return length(d)-11.;if(p.y>14.)return p.y-13.;\n vec2 g=floor(p.xz/.9);vec2 o=(g+.5+.6*(h22(g)-.5))*.9;float k=h2(g);if(k>.55||length(o-c)>11.)return .3;\n vec3 q=p-vec3(o.x,0,o.y);float hgt=7.+5.*h2(g+3.);q.xz+=q.y*q.y*.004*vec2(1.,.5);\n float st=length(q.xz)-.05;st=max(st,q.y-hgt);\n leaf=length((p-vec3(c.x,9.5,c.y))*vec3(.11,.35,.11))-1.+(fb3(p*1.4)-.5)*.6;leaf*=2.;\n return st;}\nfloat MATH,HRY,HMIR;vec3 HQ;\nfloat house(vec3 p){vec2 l=(p.xz-VC.xz)/11.;vec2 c=floor(l);if(abs(c.x)<.5)return 1e9; // 正中留一条主街\n vec2 ctr=(c+.5)*11.+VC.xz;float dv=length((ctr-VC.xz)*vec2(1.,1.15));if(dv>64.)return 1e9;\n float r=h2(c*1.7+3.);if(r<.18)return 1.2;\n vec3 q=p-vec3(ctr.x,0.,ctr.y);if(r>.82)q.xz=q.zx;\n float k;float gy=basinH(ctr,k);q.y-=gy;\n float two=step(.7,h2(c+9.));float hw=1.35+two*1.1;\n vec3 hs=vec3(3.1,hw,2.1);\n float bb=sbox(q-vec3(.25,hs.y+.85,-.4),vec3(3.95,hs.y+.95,3.3));if(bb>.5)return bb;\n HQ=q;HRY=2.*hs.y;HMIR=r>.82?1.:0.;bool near=LODT<38.;\n float wall=sbox(q-vec3(0,hs.y,0),hs);\n float door=sbox(q-vec3(.0,.95,-2.1),vec3(.48,.95,.12));wall=max(wall,-door);\n float win=sbox(vec3(abs(q.x)-1.75,q.y-hs.
